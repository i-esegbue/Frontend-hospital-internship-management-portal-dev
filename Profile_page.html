<!doctype html>
<html lang="en">
<head>
  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.4/css/dataTables.bootstrap5.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Admin Dashboard</title>

</head>
<body>

 <nav class="navbar navbar-expand-lg navbar-light bg-light  p-2 m-0 w-100">
        <div class="container-fluid">
            <a class="navbar-brand text-primary fw-bold" href="index.html">Lancashire Medicare</a>
        </div>
  </nav>

    <div class=" h-100">
        <div class="row g-0 h-100">
            <!-- Sidebar -->
            <aside class="col-md-2 bg-light p-3 h-100 border-end" id="sidebar"> <!--  side bar starts here -->
         <div class="d-flex flex-column  bg-light h-100 ">

            
        <button onclick="history.back()" class="btn btn-primary"> &larr; Go Back </button>

        
    
    
      </div>
   
    </aside> <!-- sidebar end here-->
        

            <!-- Main -->
             <main class="col-12 col-md-9 col-xl-10 p-4">
                <div class="container">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="mb-0">Edit Profile</h2>
                        <div>
                            <button class="btn btn-outline-secondary me-2">Cancel</button>
                            <button form="profileForm" class="btn btn-primary">Save Changes</button>
                        </div>
                    </div>

                    <div class="row g-4">
                        <div class="col-12 col-lg-4">
                            <div class="card shadow-sm">
                                <div class="card-body text-center">
                                    <img id="avatarPreview" class="avatar mb-3" alt="Profile avatar" src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="100%" height="100%" fill="%23e9ecef"/><text x="50%" y="50%" font-family="Arial" font-size="96" fill="%23888" text-anchor="middle" alignment-baseline="central">?</text></svg>'>
                                    <h5 class="mb-1" id="displayName">Your Name</h5>
                                    <p class="text-muted small mb-3">Member since 2025</p>

                                    <div class="d-grid gap-2">
                                        <label class="btn btn-outline-primary file-input-btn mb-0">
                                            Change photo
                                            <input id="avatarInput" name="avatar" type="file" accept="image/*" hidden>
                                        </label>
                                        <button id="removePhoto" type="button" class="btn btn-outline-danger">Remove photo</button>
                                    </div>

                                    <small class="text-muted d-block mt-3">JPG, PNG up to 5MB. Cropping will be applied by the server.</small>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 col-lg-8">
                            <form id="profileForm" class="card p-3 shadow-sm" method="post" enctype="multipart/form-data">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="firstName" class="form-label">First name</label>
                                        <input id="firstName" name="firstName" type="text" class="form-control" placeholder="Jane" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="lastName" class="form-label">Last name</label>
                                        <input id="lastName" name="lastName" type="text" class="form-control" placeholder="Doe" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="email" class="form-label">Email</label>
                                        <input id="email" name="email" type="email" class="form-control" placeholder="you@example.com" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="phone" class="form-label">Phone</label>
                                        <input id="phone" name="phone" type="tel" class="form-control" placeholder="+1 555 0100">
                                    </div>

                                    <div class="col-12">
                                        <label for="bio" class="form-label">Bio</label>
                                        <textarea id="bio" name="bio" class="form-control" rows="4" placeholder="A short bio..."></textarea>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="social" class="form-label">Social</label>
                                        <input id="twitter" name="twitter" type="text" class="form-control" placeholder="@username">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="LinkedIn" class="form-label">LinkedIn</label>
                                        <input id="website" name="website" type="url" class="form-control" placeholder="https://LinkedIn.com/">
                                    </div>

                                    <div class="col-12 d-flex justify-content-end gap-2 mt-2">
                                        <button type="reset" class="btn btn-outline-secondary">Reset</button>
                                        <button type="submit" class="btn btn-primary">Save profile</button>
                                    </div>
                                </div>
                            </form>

                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  

    <footer class="bd-footer py-3 mt-auto bg-dark text-center text-light">
  &copy; 2025 Lancashire Medicare
</footer>

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.4/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.3.4/js/dataTables.bootstrap5.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <script src="script.js"></script> 
        <script src="charts.js"></script> 
        <!-- Bootstrap 5 JS Bundle (with Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/script.js" defer></script>
<script src="js/auth.js" defer></script>
</body>
</html>
